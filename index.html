<style>
/* ===== v4: kalender, tabel kelas, dashboard ===== */
.k-Hadir,.kal .kc.k-Hadir{background:#16a679;color:#fff}
.k-Izin,.kal .kc.k-Izin{background:#f5a524;color:#3d2a00}
.k-Sakit,.kal .kc.k-Sakit{background:#2f7df6;color:#fff}
.k-Alpa,.kal .kc.k-Alpa{background:#e5484d;color:#fff}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 8px}
.kal .kh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.kal .kc{text-align:center;font-size:13px;font-weight:700;padding:7px 0;border-radius:10px;background:var(--field);color:var(--ink2)}
.kal .kh.kw{color:var(--bad)}
.kal .kc.kw{background:rgba(229,72,77,.10);color:var(--bad);font-weight:600}
.kleg i.lib{background:rgba(229,72,77,.18)}
.tb th.wk{color:var(--bad);background:rgba(229,72,77,.12)}
.tb td.wk{background:rgba(229,72,77,.08)}
.kleg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 8px}
.kleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}
.tb{border-collapse:collapse;font-size:12px;width:100%}
.tb th,.tb td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);min-width:24px}
.tb th{background:var(--field);font-weight:800;color:var(--ink2)}
.tb td:first-child,.tb th:first-child{position:sticky;left:0;background:var(--card);text-align:left;min-width:110px;padding-left:8px;font-weight:700;white-space:nowrap;z-index:1}
.tb th:first-child{background:var(--field)}
.tb td.sum{font-weight:800}
.tb tr.rendah td:first-child{color:var(--bad)}
.tb tr.rendah td.pr{color:var(--bad);font-weight:800}
.tbbar{display:flex;gap:8px}.tbbar button{margin-top:0}
#pers{flex:none;margin:0 0 8px}
#pers .pt{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
#pers .pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#pers .pb i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
#filt{display:flex;gap:8px;margin-top:8px}
#filt input{margin:0;padding:9px 12px;flex:1;min-width:0}
#filt select{padding:9px 8px}
.hisa{display:none;gap:4px}
@media (min-width:900px){
  .hisa{display:flex}
  #listSiswa .siswa select{display:none}
  #vDash .hisa button.mini{width:34px;padding:7px 0;font-size:13px;margin:0}
  .hisa button.on.hs-Hadir{background:var(--ok);color:#fff}
  .hisa button.on.hs-Izin{background:var(--accent);color:#4a3600}
  .hisa button.on.hs-Sakit{background:var(--brand);color:#fff}
  .hisa button.on.hs-Alpa{background:var(--bad);color:#fff}
  body.app #vRekap{max-width:1000px}
  .wrap:has(#vKRekap:not(.hidden)){max-width:1000px}
}
</style>

<script>
function mulaiUI(){
var P = { tema:"biru", gelap:false, suara:true, bunyi:true, nada:"tek", ringkas:false };
try{ Object.assign(P, JSON.parse(localStorage.getItem("pref") || "{}")); }catch(e){}
function simpan(){ try{ localStorage.setItem("pref", JSON.stringify(P)); }catch(e){} }
var TEMA = { biru:["#2196f3","#1b7fd0","#e8f3fe","#2f7df6","#5b9dff"], hijau:["#16a679","#0f8a63","#e6f7f1","#12936b","#3cc79b"],
  ungu:["#7a5af8","#6746e8","#f0ecff","#6a4cf0","#8d74ff"], oranye:["#f08a24","#d6730f","#fff1e0","#ee7d12","#ffb066"],
  pink:["#e5508a","#c93d74","#fdecf3","#d9437b","#ff86b3"] };

function terapkan(){
  var t = TEMA[P.tema] || TEMA.biru, s = document.body.style;
  s.setProperty("--brand", t[0]); s.setProperty("--brand-dark", t[1]);
  s.setProperty("--brand-soft", P.gelap ? "rgba(255,255,255,.08)" : t[2]);
  s.setProperty("--g1", t[3]); s.setProperty("--g2", t[4]);
  document.body.classList.toggle("gelap", !!P.gelap);
  document.body.classList.toggle("ringkas", !!P.ringkas);
}
terapkan();

// ---------- bunyi tombol PIN ----------
var NADA = {
  tek:    { nama:"Tek (bawaan)",   t:"square",   f1:1400, f2:900,  d:0.09, v:0.30 },
  pop:    { nama:"Pop",            t:"sine",     f1:700,  f2:220,  d:0.10, v:0.80 },
  tok:    { nama:"Tok (kayu)",     t:"triangle", f1:330,  f2:160,  d:0.12, v:0.90 },
  bip:    { nama:"Bip",            t:"sine",     f1:1800, f2:1800, d:0.08, v:0.55 },
  lembut: { nama:"Lembut",         t:"sine",     f1:900,  f2:700,  d:0.07, v:0.55 },
  mati:   { nama:"Tanpa bunyi" }
};
function klik(){
  var n = NADA[P.nada] || NADA.tek;
  if(!n.t) return;
  try{
    initAudio();
    if(audioCtx){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
      o.type = n.t;
      o.frequency.setValueAtTime(n.f1, t);
      if(n.f2 !== n.f1) o.frequency.exponentialRampToValueAtTime(n.f2, t + n.d * 0.7);
      g.gain.setValueAtTime(n.v, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + n.d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + n.d + 0.02);
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}

// ---------- login: pilih nama lalu PIN (otomatis masuk) ----------
var PINAKTIF = null;
var PIN_DEFAULT = 6;
var BACK = {};
window.kembaliAkun = function(id){
  var f = BACK[id];
  if(f) f(); else pilih("vPilih");
};
function pasangKembali(viewId, boxId){
  var bs = $(viewId).querySelectorAll("button.gray"), b = bs[bs.length - 1];
  if(b){ b.onclick = function(){ kembaliAkun(boxId); }; }
}
pasangKembali("vLogin", "gBox");
pasangKembali("vKLogin", "kBox");
pasangKembali("vWali", "wBox");

function renderPin(box, o){
  var pin = "", sibuk = false, N = o.panjang || PIN_DEFAULT;
  box.innerHTML = '<div class="pn"><b></b><small></small></div><div class="pd"></div><div class="pad"></div>';
  box.querySelector(".pn b").textContent = o.judul; box.querySelector(".pn small").textContent = o.sub;
  var d = box.querySelector(".pd"), pad = box.querySelector(".pad");
  ["1","2","3","4","5","6","7","8","9","C","0","⌫"].forEach(function(k){
    var b = document.createElement("button"); b.type = "button"; b.textContent = k; b.setAttribute("data-k", k); pad.appendChild(b); });
  function gambar(){ var h = ""; for(var i = 0; i < N; i++) h += '<i class="' + (i < pin.length ? "on" : "") + '"></i>'; d.innerHTML = h; }
  function kirim(){
    if(sibuk || pin.length !== N) return;
    sibuk = true;
    o.onOk(pin, function(){ sibuk = false; pin = ""; gambar(); });
  }
  function tekan(k){
    if(sibuk) return;
    klik();
    if(k === "C") pin = "";
    else if(k === "⌫") pin = pin.slice(0, -1);
    else if(pin.length < N) pin += k;
    gambar();
    if(pin.length === N) setTimeout(kirim, 180);
  }
  pad.onclick = function(e){ var k = e.target.getAttribute("data-k"); if(k) tekan(k); };
  BACK[box.id] = o.onBack;
  PINAKTIF = { box:box, tekan:tekan }; say(o.msg, ""); gambar();
}
document.addEventListener("keydown", function(e){
  if(!PINAKTIF || !PINAKTIF.box.offsetParent) return;
  if(/^\d$/.test(e.key)) PINAKTIF.tekan(e.key); else if(e.key === "Backspace") PINAKTIF.tekan("⌫");
});
function daftarNama(box, items, fn, judul, back){
  PINAKTIF = null; box.innerHTML = ""; BACK[box.id] = back || null;
  if(judul){ var p = document.createElement("p"); p.className = "lead2"; p.textContent = judul; box.appendChild(p); }
  var w = document.createElement("div"); w.className = "nlist";
  items.forEach(function(it){
    var b = document.createElement("button"); b.type = "button"; b.className = "nb2";
    b.innerHTML = '<span class="av"></span><span><b></b><small></small></span>';
    b.querySelector(".av").textContent = String(it.t).charAt(0).toUpperCase();
    b.querySelector("b").textContent = it.t; b.querySelector("small").textContent = it.s || "";
    b.onclick = function(){ fn(it); }; w.appendChild(b);
  });
  box.appendChild(w);
}
function muatDaftar(box, act, msg, fn){
  PINAKTIF = null; box.innerHTML = ""; BACK[box.id] = null;
  if(!apiSiap(msg)) return;
  say(msg, "Memuat...", "info");
  api(act, {}).then(function(r){
    if(r.status !== "success"){ say(msg, r.message, "err"); return; }
    if(msg.textContent === "Memuat...") say(msg, "");
    fn(r);
  }).catch(function(e){ say(msg, galat(e), "err"); });
}
function loginAkun(act, box, msg, daftar, sukses){
  function muat(){ muatDaftar($(box), daftar.act, $(msg), function(r){
    daftarNama($(box), r[daftar.key].map(function(g){ return { t:g.nama, s:g.kelas ? "Kelas " + g.kelas : "", g:g }; }),
      function(it){ pin(it.g); }, "Pilih nama Anda"); }); }
  function pin(g){
    renderPin($(box), { judul:g.nama, sub:"Masukkan PIN Anda", msg:$(msg), panjang:g.panjang, onBack:muat, onOk:function(p, reset){
      unlockSuara(); say($(msg), "Memproses login...", "info");
      api(act, { username:g.username, password:p }).then(function(r){
        if(!r || r.status !== "success"){ say($(msg), (r && r.message) || "Login gagal", "err"); reset(); return; }
        say($(msg), ""); sukses(r);
      }).catch(function(e){ say($(msg), galat(e), "err"); reset(); });
    }});
  }
  return muat;
}
var muatGuru = loginAkun("login", "gBox", "loginMsg", { act:"daftarGuru", key:"guru" }, function(r){
  S.token = r.token; S.nama = r.namaGuru; S.kelas = r.kelas;
  sessionStorage.setItem("sesi", JSON.stringify({ role:"guru", token:S.token, nama:S.nama, kelas:S.kelas }));
  openDash();
});
var muatKepsek = loginAkun("loginKepsek", "kBox", "kLoginMsg", { act:"daftarKepsek", key:"kepsek" }, function(r){
  K.token = r.token; K.nama = r.nama;
  sessionStorage.setItem("sesi", JSON.stringify({ role:"kepsek", token:K.token, nama:K.nama }));
  openKepsek();
});
var WL = [];
function muatKelas(){
  muatDaftar($("wBox"), "daftarKelas", $("wMsg"), function(r){
    WL = r.kelas;
    if(!WL.length){ say($("wMsg"), "Data murid belum tersedia.", "err"); return; }
    daftarNama($("wBox"), WL.map(function(k){ return { t:k.kelas, s:k.siswa.length + " murid", k:k }; }),
      function(it){ wSiswa(it.k); }, "Pilih kelas anak Anda");
  });
}
function wSiswa(k){
  daftarNama($("wBox"), k.siswa.map(function(n){ return { t:n, s:"Kelas " + k.kelas }; }),
    function(it){ wPin(k, it.t); }, "Kelas " + k.kelas + " · pilih nama anak", muatKelas);
}
function wPin(k, nama){
  var msg = $("wMsg");
  renderPin($("wBox"), { judul:nama, sub:"Kelas " + k.kelas + " · masukkan PIN dari sekolah", msg:msg, panjang:6,
    onBack:muatKelas, onOk:function(p, reset){
      say(msg, "Memeriksa...", "info");
      api("loginWali", { nama:nama, kode:p, kelas:k.kelas }).then(function(r){
        if(!r || r.status !== "success"){ say(msg, (r && r.message) || "Gagal masuk.", "err"); reset(); return; }
        W.token = r.token; W.nama = r.nama; W.kelas = r.kelas;
        $("wJudul").textContent = "Absensi " + r.nama; $("wInfo").textContent = "Kelas " + r.kelas;
        $("wBulan").value = bln(); $("wrRingkas").textContent = ""; $("wrList").innerHTML = ""; say($("wrMsg"), "");
        say(msg, ""); show("vWaliHasil"); muatRekapWali();
      }).catch(function(e){ say(msg, galat(e), "err"); reset(); });
    }});
}

// ---------- rapikan dashboard guru ----------
var tKeluar = $("vDash").querySelector("button.red"); if(tKeluar) tKeluar.remove();
var tRekap = $("vDash").querySelector('button[onclick="bukaRekap()"]'); if(tRekap) tRekap.remove();

// ---------- REKAP: kalender per murid (guru, kepala sekolah, wali) ----------
var HARI = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function namaBulan(b){ return BULAN[Number(b.substring(5, 7)) - 1] + " " + b.substring(0, 4); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function persen(h){ var t = h.Hadir + h.Izin + h.Sakit + h.Alpa; return t ? Math.round(h.Hadir * 100 / t) : -1; }

tampilRekap = function(r, eR, eL){
  var h = r.hitung, pr = persen(h);
  eR.textContent = r.nama + ": Hadir " + h.Hadir + " | Izin " + h.Izin + " | Sakit " + h.Sakit + " | Alpa " + h.Alpa +
    (pr >= 0 ? " | " + pr + "% hadir" : "");
  eL.innerHTML = "";
  if(!r.list.length){ eL.textContent = "Belum ada catatan absen di bulan ini."; return; }
  var by = {}; r.list.forEach(function(x){ by[Number(x.key.substring(8, 10))] = x; });
  var y = Number(r.bulan.substring(0, 4)), m = Number(r.bulan.substring(5, 7));
  var n = new Date(y, m, 0).getDate(), off = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  var cal = document.createElement("div"); cal.className = "kal";
  HARI.forEach(function(d, i){ var e = document.createElement("div"); e.className = "kh" + (i >= 5 ? " kw" : ""); e.textContent = d; cal.appendChild(e); });
  for(var i = 0; i < off; i++) cal.appendChild(document.createElement("div"));
  for(var t = 1; t <= n; t++){
    var c = document.createElement("div"), x = by[t];
    var libur = (off + t - 1) % 7 >= 5;
    c.className = "kc" + (x ? " k-" + x.status : (libur ? " kw" : ""));
    c.textContent = t;
    if(x) c.title = x.status + " (" + x.jam + ")"; else if(libur) c.title = "Libur (Sabtu/Minggu)";
    cal.appendChild(c);
  }
  eL.appendChild(cal);
  var lg = document.createElement("div"); lg.className = "kleg";
  lg.innerHTML = '<span><i class="k-Hadir"></i>Hadir</span><span><i class="k-Izin"></i>Izin</span><span><i class="k-Sakit"></i>Sakit</span><span><i class="k-Alpa"></i>Alpa</span><span><i class="lib"></i>Libur (Sabtu/Minggu)</span>';
  eL.appendChild(lg);
  r.list.forEach(function(x){ baris(eL, x.tanggal, x.status + " (" + x.jam + ")"); });
};

// ---------- REKAP: tabel kelas per bulan + unduh Excel / cetak ----------
function htmlTabel(r){
  var y = Number(r.bulan.substring(0, 4)), m = Number(r.bulan.substring(5, 7));
  function wk(d){ var w = new Date(y, m - 1, d).getDay(); return w === 0 || w === 6 ? "wk" : ""; }
  var h = '<table class="tb"><thead><tr><th>Nama</th>', d;
  for(d = 1; d <= r.hari; d++) h += '<th class="' + wk(d) + '">' + d + "</th>";
  h += "<th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr></thead><tbody>";
  r.siswa.forEach(function(s){
    var c = s.hitung, pr = persen(c);
    h += '<tr class="' + (pr >= 0 && pr < 75 ? "rendah" : "") + '"><td>' + esc(s.nama) + "</td>";
    for(d = 1; d <= r.hari; d++){ var st = s.hari[d]; h += '<td class="' + (st ? "k-" + st : wk(d)) + '">' + (st ? st.charAt(0) : "") + "</td>"; }
    h += '<td class="sum">' + c.Hadir + '</td><td class="sum">' + c.Izin + '</td><td class="sum">' + c.Sakit + '</td><td class="sum">' + c.Alpa +
         '</td><td class="sum pr">' + (pr >= 0 ? pr + "%" : "-") + "</td></tr>";
  });
  return h + "</tbody></table>";
}
function unduhCSV(r){
  var L = [], hd = ["Nama"], d;
  for(d = 1; d <= r.hari; d++) hd.push(d);
  hd.push("Hadir", "Izin", "Sakit", "Alpa", "% Hadir"); L.push(hd);
  r.siswa.forEach(function(s){
    var row = [s.nama], c = s.hitung, pr = persen(c);
    for(d = 1; d <= r.hari; d++) row.push(s.hari[d] ? s.hari[d].charAt(0) : "");
    row.push(c.Hadir, c.Izin, c.Sakit, c.Alpa, pr >= 0 ? pr + "%" : "-"); L.push(row);
  });
  var csv = "\ufeff" + L.map(function(a){ return a.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
  var a = document.createElement("a"), url = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.href = url; a.download = "Absensi " + r.kelas + " " + r.bulan + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function cetakTabel(r){
  var w = window.open("", "_blank");
  if(!w){ alert("Pop-up diblokir. Izinkan pop-up untuk situs ini lalu coba lagi."); return; }
  w.document.write('<html><head><title>Absensi ' + esc(r.kelas) + ' ' + r.bulan + '</title><style>' +
    '@page{size:landscape;margin:10mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'body{font-family:Arial,sans-serif;font-size:11px}h3{margin:0 0 8px}' +
    'table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:2px 3px;text-align:center}' +
    'td:first-child,th:first-child{text-align:left;white-space:nowrap}th{background:#eee}' +
    '.wk{background:#f3d9da}th.wk{color:#b3262b}.k-Hadir{background:#16a679;color:#fff}.k-Izin{background:#f5a524;color:#3d2a00}.k-Sakit{background:#2f7df6;color:#fff}.k-Alpa{background:#e5484d;color:#fff}' +
    '.rendah td:first-child,.rendah .pr{color:#b3262b;font-weight:700}.sum{font-weight:700}p{margin-top:8px;color:#555}' +
    '</style></head><body><h3>Rekap Absensi Kelas ' + esc(r.kelas) + ' - ' + namaBulan(r.bulan) + '</h3>' + htmlTabel(r) +
    '<p>H = Hadir, I = Izin, S = Sakit, A = Alpa. Nama merah = kehadiran di bawah 75%. Kolom merah muda = Sabtu/Minggu (libur).</p></body></html>');
  w.document.close(); w.focus(); setTimeout(function(){ w.print(); }, 300);
}
function renderTabel(box, r){
  box.innerHTML = "";
  var bar = document.createElement("div"); bar.className = "tbbar";
  [["⬇️ Unduh Excel", function(){ unduhCSV(r); }], ["🖨️ Cetak", function(){ cetakTabel(r); }]].forEach(function(a){
    var b = document.createElement("button"); b.type = "button"; b.className = "gray"; b.textContent = a[0]; b.onclick = a[1]; bar.appendChild(b); });
  box.appendChild(bar);
  var w = document.createElement("div"); w.className = "tbw"; w.innerHTML = htmlTabel(r); box.appendChild(w);
  var n = document.createElement("div"); n.className = "msg"; n.style.fontSize = "11.5px";
  n.textContent = "H = Hadir, I = Izin, S = Sakit, A = Alpa. Nama merah = kehadiran di bawah 75%. Kolom merah muda = Sabtu/Minggu (libur)."; box.appendChild(n);
}
function muatTabelGuru(){
  var b = $("rkBulan").value; if(!b){ say($("rkMsg"), "Pilih bulan.", "err"); return; }
  $("rkRingkas").textContent = "";
  ambil("tabelKelas", { token:S.token, bulan:b }, $("rkMsg"), function(r){
    $("rkRingkas").textContent = "Kelas " + r.kelas + " · " + namaBulan(r.bulan) + " · " + r.siswa.length + " murid";
    renderTabel($("rkList"), r);
  }, logout);
}
function muatTabelKepsek(){
  var k = K.kelas[Number($("krKelas").value)], b = $("krBulan").value;
  if(!k || !b){ say($("krMsg"), "Pilih kelas dan bulan.", "err"); return; }
  $("krRingkas").textContent = "";
  ambil("tabelKelas", { token:K.token, kelas:k.kelas, bulan:b }, $("krMsg"), function(r){
    $("krRingkas").textContent = "Kelas " + r.kelas + " · " + namaBulan(r.bulan) + " · " + r.siswa.length + " murid";
    renderTabel($("krList"), r);
  }, logout);
}
function tombolTabel(sel, fn){
  var ref = document.querySelector(sel); if(!ref) return;
  var b = document.createElement("button"); b.type = "button"; b.className = "gray"; b.textContent = "📋 Tabel Kelas"; b.onclick = fn;
  ref.parentNode.insertBefore(b, ref.nextSibling);
}
tombolTabel('#vRekap button[onclick="muatRekap()"]', muatTabelGuru);
tombolTabel('#vKRekap button[onclick="muatKRekap()"]', muatTabelKepsek);

// ---------- navigasi (sidebar laptop / bar bawah HP) ----------
VIEWS.push("vSet");
var nav = document.createElement("nav"); nav.id = "nav";
nav.innerHTML = '<div class="nh"><img src="logo.png" alt="" onerror="this.style.display=\'none\'"><div><b>KB RA At Tibyan</b><small id="nvNama"></small></div></div>' +
  [["abs","🏠","Absensi"],["rek","📊","Rekap"],["set","⚙️","Pengaturan"],["out","🚪","Keluar"]].map(function(i){
    return '<button type="button" class="nb' + (i[0] === "out" ? " out" : "") + '" data-go="' + i[0] + '"><span>' + i[1] + '</span>' + i[2] + '</button>'; }).join("");
document.body.appendChild(nav);
var PETA = { vDash:"abs", vCam:"abs", vRekap:"rek", vSet:"set" };
function go(k){
  if(k === "out"){ logout(); return; }
  if(k === "abs"){ if(!$("vCam").classList.contains("hidden")) closeCam(); else show("vDash"); return; }
  stopCam();
  if(k === "rek") bukaRekap();
  else if(k === "set"){ isiSet(); show("vSet"); }
}
nav.addEventListener("click", function(e){ var b = e.target.closest("[data-go]"); if(b) go(b.getAttribute("data-go")); });
var _show = show;
show = function(id){
  _show(id);
  var ap = !!PETA[id];
  document.body.classList.toggle("app", ap);
  if(id === "vLogin") muatGuru(); else if(id === "vKLogin") muatKepsek(); else if(id === "vWali") muatKelas();
  if(ap){
    $("nvNama").textContent = (S.nama || "") + (S.kelas ? " · " + S.kelas : "");
    Array.prototype.forEach.call(nav.querySelectorAll(".nb"), function(b){ b.classList.toggle("on", b.getAttribute("data-go") === PETA[id]); });
  }
};

// ---------- DASHBOARD: jam digital ----------
var jm = document.createElement("span"); jm.id = "jam";
$("dTgl").parentNode.appendChild(document.createTextNode(" | ")); $("dTgl").parentNode.appendChild(jm);
setInterval(function(){
  if(jm.offsetParent) jm.textContent = new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit", second:"2-digit" }).replace(/\./g, ":");
}, 1000);

// ---------- DASHBOARD: ringkasan + persentase kehadiran ----------
var st = document.createElement("div"); st.id = "stat";
$("vDash").insertBefore(st, $("vDash").querySelector(".card"));
var pers = document.createElement("div"); pers.id = "pers"; pers.innerHTML = '<div class="pt"></div><div class="pb"><i></i></div>';
st.parentNode.insertBefore(pers, st.nextSibling);
function stat(){
  var c = { Hadir:0, Izin:0, Sakit:0, Alpa:0, Belum:0 };
  S.siswa.forEach(function(x){ c[c[x.nilai] !== undefined ? x.nilai : "Belum"]++; });
  st.innerHTML = Object.keys(c).map(function(k, i){ return '<div class="c' + i + '"><b>' + c[k] + '</b><small>' + k + '</small></div>'; }).join("");
  var n = S.siswa.length, p = n ? Math.round(c.Hadir * 100 / n) : 0;
  pers.querySelector(".pt").textContent = "Kehadiran hari ini: " + c.Hadir + " dari " + n + " murid (" + p + "%)";
  pers.querySelector("i").style.width = p + "%";
}

// ---------- DASHBOARD: cari & saring daftar murid ----------
var filt = document.createElement("div"); filt.id = "filt";
filt.innerHTML = '<input type="text" id="cari" placeholder="🔍 Cari nama murid"><select id="fSt">' +
  '<option value="">Semua</option><option value="_belum">Belum absen</option><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select>';
$("listSiswa").parentNode.insertBefore(filt, $("listSiswa"));
function saring(){
  var q = $("cari").value.trim().toLowerCase(), f = $("fSt").value, rows = $("listSiswa").children;
  S.siswa.forEach(function(x, i){
    var r = rows[i]; if(!r || !r.classList.contains("siswa")) return;
    var ok = (!q || x.nama.toLowerCase().indexOf(q) >= 0) && (!f || (f === "_belum" ? !x.nilai : x.nilai === f));
    r.style.display = ok ? "" : "none";
  });
}
$("cari").addEventListener("input", saring); $("fSt").addEventListener("change", saring);

// ---------- DASHBOARD: tombol status H / I / S / A (tampil di laptop) ----------
function seg(){
  var rows = $("listSiswa").children;
  S.siswa.forEach(function(x, i){
    var row = rows[i]; if(!row || !x.el) return;
    var g = row.querySelector(".hisa");
    if(!g){
      g = document.createElement("div"); g.className = "hisa";
      [["Hadir","H"],["Izin","I"],["Sakit","S"],["Alpa","A"]].forEach(function(a){
        var b = document.createElement("button"); b.type = "button"; b.className = "mini gray hs-" + a[0]; b.textContent = a[1]; b.title = a[0];
        b.onclick = function(){ x.nilai = (x.nilai === a[0]) ? "" : a[0]; x.el.value = x.nilai; seg(); stat(); saring(); };
        g.appendChild(b);
      });
      row.insertBefore(g, x.el);
    }
    Array.prototype.forEach.call(g.children, function(b){ b.classList.toggle("on", b.title === x.nilai); });
  });
}
var _rs = renderSiswa; renderSiswa = function(){ _rs(); seg(); stat(); saring(); };
var _ss = setSemua; setSemua = function(s){ _ss(s); seg(); stat(); saring(); };
$("listSiswa").addEventListener("change", function(){ seg(); stat(); saring(); });

// ---------- suara mengikuti pengaturan ----------
var _bicara = bicara, _tit = tit;
bicara = function(t){ if(P.suara === false){ tampilUcapan(t); return; } _bicara(t); };
tit = function(){ if(P.bunyi !== false) _tit(); };

// ---------- menu pengaturan ----------
var vs = document.createElement("div"); vs.id = "vSet"; vs.className = "card hidden";
vs.innerHTML = '<h3>⚙️ Pengaturan</h3>' +
  '<h4>Warna tema</h4><div class="row">' + Object.keys(TEMA).map(function(k){ return '<button type="button" class="sw" data-t="' + k + '" style="background:' + TEMA[k][0] + '"></button>'; }).join("") + '</div>' +
  '<h4>Mode tampilan</h4><div class="row"><button type="button" class="seg" data-m="0">☀️ Terang</button><button type="button" class="seg" data-m="1">🌙 Gelap</button></div>' +
  '<h4>Daftar murid</h4><label class="tg">Tampilan ringkas (sembunyikan keterangan)<input type="checkbox" data-k="ringkas"></label>' +
  '<h4>Suara</h4><label class="tg">Suara ucapan nama murid<input type="checkbox" data-k="suara"></label>' +
  '<label class="tg">Bunyi tit saat wajah dikenali<input type="checkbox" data-k="bunyi"></label>' +
  '<h4>Bunyi tombol PIN</h4><select id="setNada" class="full">' +
    Object.keys(NADA).map(function(k){ return '<option value="' + k + '">' + NADA[k].nama + '</option>'; }).join("") + '</select>' +
  '<button type="button" class="gray" id="setTes">🔈 Tes Suara</button>' +
  '<button type="button" class="gray" id="setReset">Kembalikan ke bawaan</button>';
$("vDash").parentNode.insertBefore(vs, $("vDash"));
function isiSet(){
  Array.prototype.forEach.call(vs.querySelectorAll(".sw"), function(b){ b.classList.toggle("on", b.getAttribute("data-t") === P.tema); });
  Array.prototype.forEach.call(vs.querySelectorAll(".seg"), function(b){ b.classList.toggle("on", (b.getAttribute("data-m") === "1") === !!P.gelap); });
  Array.prototype.forEach.call(vs.querySelectorAll("input[data-k]"), function(i){ i.checked = P[i.getAttribute("data-k")] !== false && !!P[i.getAttribute("data-k")]; });
  $("setNada").value = NADA[P.nada] ? P.nada : "tek";
}
vs.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-t")) P.tema = b.getAttribute("data-t");
  else if(b.hasAttribute("data-m")) P.gelap = b.getAttribute("data-m") === "1";
  else if(b.id === "setTes"){ tesSuara(); return; }
  else if(b.id === "setReset") P = { tema:"biru", gelap:false, suara:true, bunyi:true, nada:"tek", ringkas:false };
  else return;
  simpan(); terapkan(); isiSet();
});
vs.addEventListener("change", function(e){
  if(e.target.id === "setNada"){ P.nada = e.target.value; simpan(); klik(); return; }
  var k = e.target.getAttribute("data-k"); if(k){ P[k] = e.target.checked; simpan(); terapkan(); }
});

// sesi yang dipulihkan saat refresh
if(!$("vDash").classList.contains("hidden")) show("vDash");
}
if(document.readyState === "complete") mulaiUI(); else window.addEventListener("load", mulaiUI);
</script>
