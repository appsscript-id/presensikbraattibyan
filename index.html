     Hanya mengubah tampilan. Kode Google Apps Script TIDAK berubah. -->
<style>
/* ---------- dasar ---------- */
body{--sh:0 8px 22px -12px rgba(47,125,246,.28)}
body:not(.gelap){--bg:#f1f6ff}
.card{border:0;border-radius:26px;box-shadow:var(--sh)}

/* ---------- kartu sapaan besar (guru & kepala sekolah) ---------- */
body #vDash .head,body #vKepsek .head{position:relative;overflow:hidden;min-height:118px;border-radius:28px;
  padding:18px clamp(100px,30vw,190px) 18px 20px;
  background:radial-gradient(110px 60px at 72% 20%,rgba(255,255,255,.30),transparent 70%),
             radial-gradient(150px 70px at 96% 85%,rgba(255,255,255,.22),transparent 70%),
             linear-gradient(120deg,var(--g1),var(--g2));
  box-shadow:0 16px 30px -18px var(--g1)}
body #vDash .head h2,body #vKepsek .head h2{display:inline-block;margin:0;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.22);font-size:12.5px;font-weight:700}
body .head h2+div{font-size:clamp(20px,5.6vw,28px);font-weight:800;line-height:1.2;margin:8px 0 4px;letter-spacing:-.4px}
body .head h2+div+div{font-size:13px;font-weight:600;opacity:.95}
body .head::before{right:14px;top:12px;bottom:auto;font-size:22px}
body .head::after{display:block!important;content:"🐥";position:absolute;left:auto;top:auto;right:14px;bottom:0;
  width:auto;height:auto;border-radius:0;background:none;font-size:clamp(62px,18vw,96px);line-height:1;z-index:1;
  animation:fl 3.2s ease-in-out infinite}
body #vKepsek .head::after{content:"🦉"}
.heroBtn{width:auto!important;margin:10px 0 0!important;padding:9px 18px!important;font-size:13.5px!important;
  background:#fff!important;color:var(--brand)!important;position:relative;z-index:2}

/* ---------- kartu ringkasan berwarna ---------- */
#stat{gap:8px}
#stat div{border-radius:20px;padding:10px 2px 8px;box-shadow:none}
#stat div::before{font-size:22px}
#stat b{font-size:22px}
#stat .c0{background:#e2f6ee}#stat .c1{background:#e5eeff}#stat .c2{background:#fff0d2}#stat .c3{background:#fde6e8}#stat .c4{background:var(--field)}
#pers{background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:var(--sh)}
#pers .pt{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:8px}

/* ---------- daftar murid ---------- */
body #vDash #listSiswa .siswa{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:10px 12px;margin-bottom:8px}
#listSiswa .siswa .ini{background:linear-gradient(135deg,var(--g1),var(--g2))}
#listSiswa .siswa .fotoM{border-color:var(--brand-soft)}

/* ---------- menu samping / bar bawah ---------- */
#nav .nh{background:var(--brand-soft);border-radius:20px;padding:10px;border-bottom:0;margin-bottom:10px}
#nav .nb{border-radius:16px}
#nav .nb.on{background:var(--brand-soft);color:var(--brand)}
#nav .nb.on span{transform:translateY(-2px) scale(1.15)}
@media (min-width:900px){#nav .nb.on{box-shadow:inset 4px 0 0 var(--brand)}}

/* ---------- kepala sekolah ---------- */
.kHero{background:linear-gradient(135deg,var(--brand-soft),var(--card));border:1.5px solid var(--line);border-radius:24px}
.kSt div{border:0;border-radius:16px}
.kSt .s0{background:#e2f6ee}.kSt .s1{background:#fff0d2}.kSt .s2{background:#e5eeff}.kSt .s3{background:#fde6e8}.kSt .s4{background:var(--field)}
details.kc{background:var(--card);border:1.5px solid var(--line);border-radius:22px}
details.kc[open]{border-color:var(--cb)}

/* ---------- wali murid ---------- */
body #vWaliHasil h3{position:relative;overflow:hidden;display:flex;align-items:center;min-height:98px;border-radius:26px;
  padding:18px clamp(96px,28vw,150px) 18px 20px;font-size:clamp(19px,5vw,24px);line-height:1.2;margin-bottom:12px;
  background:radial-gradient(110px 60px at 72% 20%,rgba(255,255,255,.30),transparent 70%),linear-gradient(120deg,var(--g1),var(--g2))}
body #vWaliHasil h3::after{content:"🐻";position:absolute;right:14px;bottom:0;font-size:clamp(60px,17vw,88px);line-height:1;
  animation:fl 3.2s ease-in-out infinite}
.wHari{padding:14px 16px;border-radius:22px}
.wHari .we{font-size:36px}
.wHari b{font-size:17px}
.infoW{border-radius:22px}

/* ---------- mode gelap ---------- */
body.gelap #stat .c0,body.gelap #stat .c1,body.gelap #stat .c2,body.gelap #stat .c3,
body.gelap .kSt .s0,body.gelap .kSt .s1,body.gelap .kSt .s2,body.gelap .kSt .s3{background:rgba(255,255,255,.07)}

/* ---------- laptop lebar: sapaan di atas, daftar murid di kiri, ringkasan di kanan ---------- */
@media (min-width:1200px){
  body.app .wrap:has(#vDash:not(.hidden)){max-width:1280px}
  body.app #vDash:not(.hidden){display:grid!important;grid-template-columns:minmax(0,1fr) 330px;
    grid-template-rows:auto auto auto auto minmax(0,1fr);column-gap:16px;row-gap:0}
  body.app #vDash .head{grid-column:1/-1;grid-row:1}
  body.app #vDash #ingat{grid-column:2;grid-row:2}
  body.app #vDash #stat{grid-column:2;grid-row:3;grid-template-columns:1fr 1fr}
  body.app #vDash #stat div:last-child{grid-column:1/-1}
  body.app #vDash #pers{grid-column:2;grid-row:4}
  body.app #vDash>.card{grid-column:1;grid-row:2/6;min-height:0}
  body.app #vDash #listSiswa{grid-template-columns:1fr}
}
</style>
<script>
// tombol Scan Wajah di kartu sapaan guru
(function(){
  function pasang(){
    var hd = document.querySelector("#vDash .head");
    if(!hd || hd.querySelector(".heroBtn")) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "heroBtn"; b.textContent = "📸 Scan Wajah";
    b.onclick = function(){ if(window.mulaiScan) mulaiScan(); };
    hd.appendChild(b);
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", pasang); else pasang();
})();
</script>
